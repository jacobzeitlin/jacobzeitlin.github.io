<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacob Zeitlin</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            min-height: 60vh;
            background-color: #ffffff;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        h1 {
            color: #000042;
            font-size: 4em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 2em;
        }

        .circle-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #000042;
            margin: 0 16px;
            text-decoration: none;
            vertical-align: top;
        }

        .circle-button img {
            width: 84%;
            height: 84%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1 id="name">Jacob Zeitlin, MD</h1>
    <div>
        <a class="circle-button" href="https://www.researchgate.net/profile/Jacob-Zeitlin">
            <img src="assets/researchgate.png" alt="ResearchGate logo">
        </a>
        <a class="circle-button" href="https://orcid.org/0000-0002-6962-5100">
            <img src="assets/orcid.png" alt="ORCID logo">
        </a>
        <a class="circle-button" href="https://www.linkedin.com/in/jacobzeitlin">
            <img src="assets/linkedin.png" alt="LinkedIn logo" style="width:66%;height:66%;">
        </a>
    </div>
    <script>
        function adjustNameFont() {
            const el = document.getElementById('name');
            el.style.fontSize = '';
            const maxWidth = document.body.clientWidth - 20;
            const currentWidth = el.scrollWidth;
            if (currentWidth > maxWidth) {
                const fontSize = parseFloat(window.getComputedStyle(el).fontSize);
                const ratio = maxWidth / currentWidth;
                el.style.fontSize = (fontSize * ratio * 0.6) + 'px';
            }
        }
        window.addEventListener('load', adjustNameFont);
        window.addEventListener('resize', adjustNameFont);
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jacob Zeitlin, MD</title>
  <style>
    :root {
      --primary-color: #000042;
    }

    /* Center horizontally, keep near the top */
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 60vh;
      background-color: #ffffff;
      font-family: 'Helvetica', 'Arial', sans-serif;
    }

    h1 {
      color: var(--primary-color);
      font-size: 4em;
      font-weight: bold;
      margin-top: 1em;
      margin-bottom: 2em;
    }

    .circle-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--primary-color);
      margin: 0 16px;
      text-decoration: none;
      vertical-align: top;
    }

    /* ResearchGate & ORCID use 84% of container */
    .circle-button img {
      width: 84%;
      height: 84%;
      object-fit: contain;
    }

    /* LinkedIn icon stays at 66% */
    .circle-button.linkedin img {
      width: 66%;
      height: 66%;
    }
  </style>
</head>
<body>
  <h1 id="name">Jacob Zeitlin, MD</h1>
  <div>
    <a class="circle-button" href="https://www.researchgate.net/profile/Jacob-Zeitlin">
      <img src="assets/researchgate.png" alt="ResearchGate logo">
    </a>
    <a class="circle-button" href="https://orcid.org/0000-0002-6962-5100">
      <img src="assets/orcid.png" alt="ORCID logo">
    </a>
    <a class="circle-button linkedin" href="https://www.linkedin.com/in/jacobzeitlin">
      <img src="assets/linkedin.png" alt="LinkedIn logo">
    </a>
  </div>
</body>
</html>
